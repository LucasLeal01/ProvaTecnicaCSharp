<header *ngIf="!isHomePage">
  <nav class="navbar navbar-modern navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand navbar-brand-modern" href="#">{{ title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link nav-link-modern" routerLink="/home" routerLinkActive="active">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-modern" routerLink="/funcionarios" routerLinkActive="active">Funcionarios</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-modern" routerLink="/ferias" routerLinkActive="active">Ferias</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main [ngClass]="{'main-container': !isHomePage}">
  <div [ngClass]="{'container py-4': !isHomePage}">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="footer-modern" *ngIf="!isHomePage">
  <div class="container">
    <p>&copy; 2025 Sistema de Gerenciamento. Todos os direitos reservados.</p>
  </div>
</footer>

<app-notification></app-notification>
