<div class="home-container">
  <div class="container-fluid p-0">
    <div class="row g-0">
      <div class="col-12">
        <h1 class="page-title">{{ title }}</h1>
        <p class="page-subtitle">{{ subtitle }}</p>
        
        <div class="row justify-content-center g-4">
          <div class="col-lg-5 col-md-6" *ngFor="let card of cards">
            <div class="card-modern" [ngClass]="card.type">
              <div class="card-body-modern">
                <div class="card-icon" [ngClass]="card.type">
                  <i [class]="card.icon"></i>
                </div>
                <h3 class="card-title-modern">{{ card.title }}</h3>
                <p class="card-text-modern">
                  {{ card.description }}
                </p>
                <a [routerLink]="card.link" class="btn-modern" [ngClass]="'btn-' + card.type + '-modern'">
                  <i class="fas fa-arrow-right me-2"></i>{{ card.buttonText }}
                </a>
              </div>
            </div>
          </div>
        </div>
        
        <div class="footer">
          <p>&copy; {{ currentYear }} Sistema de Gerenciamento. Todos os direitos reservados.</p>
        </div>
      </div>
    </div>
  </div>
</div>
